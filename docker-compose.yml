# Infrastructure de développement pour le Poste de travail unifié.
# Démarre uniquement les dépendances (bus + base de l'état du poste).
# Le backend et le frontend se lancent ensuite avec leurs commandes natives
# (voir README) pour garder un cycle de dev rapide.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: poste-rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # console de gestion
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: poste-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: poste
      POSTGRES_USER: poste
      POSTGRES_PASSWORD: poste
    volumes:
      - poste-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poste"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service RECO (reconnaissance véhicule + lecture de plaque, ADR 0011). OPTIONNEL :
  # derrière le profil "reco" pour ne pas alourdir le cycle de dev (le mode mock du
  # backend n'en a pas besoin). Le lancer seulement pour tester reco.mode=http :
  #   docker-compose --profile reco up -d reco-service
  # (1re fois : build + téléchargement des modèles ML, peut être long).
  reco-service:
    profiles: ["reco"]
    build: ./services/reco
    image: reco-service:latest
    container_name: poste-reco
    ports:
      - "8088:8088"
    environment:
      ULTRALYTICS_DIR: /models
      FAST_ALPR_HOME: /models/fast-alpr
      RECO_SEUIL_VEHICULE: "0.45"
      RECO_SEUIL_PLAQUE: "0.35"
    volumes:
      - reco-models:/models          # persiste les poids des modèles entre redémarrages
    healthcheck:
      # python est dans l'image (pas curl) : sonde /health via urllib.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s              # chargement des modèles au démarrage

volumes:
  poste-pgdata:
  reco-models:
