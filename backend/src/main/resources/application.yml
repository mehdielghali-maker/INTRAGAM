spring:
  application:
    name: poste-travail-unifie

  # PostgreSQL : état du poste UNIQUEMENT (suivi des workflows), jamais le
  # transactionnel des systèmes de référence (ADR 0004).
  datasource:
    url: jdbc:postgresql://localhost:5432/poste
    username: poste
    password: poste

  jpa:
    hibernate:
      # Dev : génération du schéma à partir des entités. En production, on passera
      # à des migrations versionnées (Flyway) — hors périmètre de cette tranche.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

# Paramètres MÉTIER du tableau de bord agence — à caler avec la DG/DFC, jamais en dur.
poste:
  tableau-bord:
    # Alerte « écart à régulariser » si l'écart dépasse le montant OU le pourcentage.
    seuil-ecart-depot:
      montant: 1000000      # DA
      pourcentage: 10       # %
    sp:
      # Périmètre du numérateur S/P : REGLES_SEULS | CHARGE_AVEC_PROVISIONS
      perimetre-numerateur: REGLES_SEULS
    periode-defaut: YTD
    # En attendant un vrai login agence : identité injectée par configuration.
    agence:
      nom: Agence Bab Ezzouar
      code: 16.I.Gharbi

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    dz.gam.poste: INFO
