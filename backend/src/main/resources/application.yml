spring:
  application:
    name: poste-travail-unifie

  # PostgreSQL : état du poste UNIQUEMENT (suivi des workflows), jamais le
  # transactionnel des systèmes de référence (ADR 0004).
  datasource:
    url: jdbc:postgresql://localhost:5432/poste
    username: poste
    password: poste

  jpa:
    hibernate:
      # Dev : génération du schéma à partir des entités. En production, on passera
      # à des migrations versionnées (Flyway) — hors périmètre de cette tranche.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Résilience aux coupures transitoires du bus (démarrage, reconnexion) : retry à la
    # publication et au démarrage des listeners, files manquantes non fatales (recovery).
    template:
      retry:
        enabled: true
        max-attempts: 5
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
    listener:
      simple:
        missing-queues-fatal: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s

server:
  port: 8080

# Paramètres MÉTIER du tableau de bord agence — à caler avec la DG/DFC, jamais en dur.
poste:
  tableau-bord:
    # Alerte « écart à régulariser » si l'écart dépasse le montant OU le pourcentage.
    seuil-ecart-depot:
      montant: 1000000      # DA
      pourcentage: 10       # %
    sp:
      # Périmètre du numérateur S/P : REGLES_SEULS | CHARGE_AVEC_PROVISIONS
      perimetre-numerateur: REGLES_SEULS
    periode-defaut: YTD

  # Contexte d'agence (brique transverse) — identité SSO mockée : l'utilisateur connecté
  # et son périmètre d'agences. L'agence active est portée par la session serveur.
  # En prod, utilisateur + périmètre proviendront des claims du token Entra ID.
  contexte:
    utilisateur:
      identifiant: m.benzerga
      nom-affiche: M. Benzerga
      profil: AGA          # AGA (multi-agences) | AGENT (mono-agence)
    # Périmètre = liste PLATE d'agences (une agence = un point de vente). Un AGA en gère
    # plusieurs ; un agent une seule. La vue consolidée cumule toutes les agences gérées.
    agences:
      - { code: 02.1.SAID, nom: Agence Saïd Hamdine }
      - { code: 02.2.HYDRA, nom: Agence Hydra }
      - { code: 02.3.BMR, nom: Agence Bir Mourad Raïs }
      - { code: 02.4.AISSAT, nom: Agence Aïssat Idir }
      - { code: 02.7.DRARIA, nom: Agence Draria }

  # Demande de cotation — libellés, branches et délais du mock central paramétrables.
  cotation:
    prefixe-reference: DC
    reference-seed: 412
    branches:
      - Auto — particulier
      - Auto — flotte
      - Multirisque habitation
      - IRD / commerce
      - RC entreprise
      - Transport
    libelles:
      BROUILLON: Brouillon
      ENVOYEE: Envoyée
      EN_COURS: En cours
      A_FINALISER: À finaliser
      AFFAIRE_GAGNEE: Affaire gagnée
      SANS_SUITE: Sans suite
    # Délais simulés du central (mock). Mettre 0 en test pour un retour immédiat.
    mock:
      delai-prise-en-charge-ms: 4000
      delai-cotation-ms: 5000
    # Identité SSO (Microsoft/Entra ID) — mockée en dev.
    identite:
      utilisateur: M. Saïdi
      code-agence: 16.I.Gharbi
      nom-agence: Agence Bab Ezzouar
      direction-regionale: DR Alger-Est

  # Accords d'échéancier (DPD) — libellés, niveau de validation et délais mock paramétrables.
  dpd:
    prefixe-reference: DE
    reference-seed: 231
    niveau-validation: DR
    libelles:
      BROUILLON: Brouillon
      ENVOYEE: Envoyée
      EN_VALIDATION: En validation
      ACCORDEE: Accordée
      REFUSEE: Refusée
    mock:
      delai-validation-ms: 4000
      delai-accord-ms: 5000
    identite:
      utilisateur: M. Saïdi
      code-agence: 16.I.Gharbi
      mail-agence: babezzouar@gam.dz
      nom-agence: Agence Bab Ezzouar
      direction-regionale: DR Alger-Est
      mail-direction-regionale: dr.algerest@gam.dz

  # Versement bancaire (preuve de paiement) — seuil aligné sur l'accueil (même définition
  # encaissé - versé), banques, mois sélectionnables et comportement du BPM (mock).
  versement:
    prefixe-reference: VB
    reference-seed: 3390
    seuil-regularisation:
      montant: 1000000      # DA (cohérent avec tableau-bord.seuil-ecart-depot)
      pourcentage: 10       # %
    banques:
      - AGB
      - BNA
      - BEA
      - CPA
      - Autre
    mois-disponibles:
      - 2026-06
      - 2026-05
      - 2026-04
      - 2026-03
    mock:
      delai-controle-ms: 4000
      delai-decision-ms: 5000
      decision: VALIDE      # VALIDE | REJETE (simulation du contrôle BPM)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    dz.gam.poste: INFO
