# nginx — sert le poste AGA (statique) et proxifie /api vers le backend (MÊME ORIGINE → pas de CORS).
# Le front ne parle JAMAIS directement au service RECO : seul le backend l'appelle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # En-têtes de sécurité (poste authentifié par cookie : anti-clickjacking, anti-sniffing).
    # ⚠️ nginx N'HÉRITE PAS des add_header dans un bloc qui en déclare d'autres → les répéter là-bas.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les photos (multipart) dépassent le 1 Mo par défaut de nginx.
    client_max_body_size 20m;

    # Service worker : JAMAIS mis en cache (mise à jour immédiate de la PWA).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # add_header local → répéter les en-têtes de sécurité (pas d'héritage nginx).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    # Manifeste : bon type MIME.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # API du poste : proxifiée vers le backend Spring (service "backend" du réseau compose).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA (React Router) : les fichiers existants (assets, manifest, sw.js) sont servis
    # EN PRIORITÉ ; toute autre route retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
